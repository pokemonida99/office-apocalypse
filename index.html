<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="上班啟示錄">
<meta name="theme-color" content="#f2b98a">
<title>上班啟示錄</title>
<link rel="apple-touch-icon" id="iconApple" href="icons/kui-180.png">
<link rel="icon" id="iconFav" type="image/png" href="icons/kui-192.png">
<link rel="manifest" id="iconManifest" href="icons/manifest-kui.json">
<script>
  // 主畫面圖示：四款可挑，加入主畫面前先換好連結（iPhone 讀 apple-touch-icon、Android 讀 manifest）
  const ICON_KEY = 'office-apocalypse-icon', ICONS = ['kui', 'mi', 'jie', 'vivi'];
  function setIcon(k) {
    document.getElementById('iconApple').href = `icons/${k}-180.png`;
    document.getElementById('iconFav').href = `icons/${k}-192.png`;
    document.getElementById('iconManifest').href = `icons/manifest-${k}.json`;
  }
  try { const k = localStorage.getItem(ICON_KEY); if (ICONS.includes(k)) setIcon(k); } catch {}
</script>
<script>
  // 開不起來時說清楚原因（不支援 3D、App 內建瀏覽器、檔案下載失敗、載入太久），不要一直停在「載入中…」
  (() => {
    const inApp = /Line\/|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|; wv\)/i.test(navigator.userAgent);
    const tip = inApp ? '你現在是用 App 內建的瀏覽器開的，請點右上角「⋯」選「用瀏覽器開啟」，或按「複製網址」貼到 Chrome／Safari。'
      : '請用最新版的 Chrome 或 Safari 開啟。Android 可以到 Play 商店更新「Chrome」和「Android System WebView」。';
    let level = 0;   // 0 沒顯示、1 可以再等等、2 開不起來
    window.bootFail = (title, detail, fatal = true) => {
      if (window.__booted || level >= (fatal ? 2 : 1)) return; level = fatal ? 2 : 1;
      const put = () => {
        const el = document.getElementById('bootMsg'); if (!el) return;
        el.querySelector('h3').textContent = title; el.querySelector('.d').textContent = detail || ''; el.querySelector('.t').textContent = tip;
        el.querySelector('.wait').style.display = fatal ? 'none' : ''; el.classList.add('on');
      };
      document.readyState === 'loading' ? addEventListener('DOMContentLoaded', put) : put();
    };
    window.bootOk = () => { window.__booted = true; const el = document.getElementById('bootMsg'); if (el) el.classList.remove('on'); };
    let gl2 = false; try { gl2 = !!document.createElement('canvas').getContext('webgl2'); } catch {}
    if (!gl2) bootFail('這支手機開不了 3D 畫面', '遊戲需要「WebGL2」3D 繪圖功能，這個瀏覽器沒有提供（太舊、或被 App 內建瀏覽器關掉了）。');
    // 太舊的瀏覽器不認得 importmap：補上 es-module-shims（新瀏覽器不會載）
    const shim = !(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'));
    if (shim) { const sc = document.createElement('script'); sc.async = true; sc.src = 'vendor/es-module-shims.js'; document.head.appendChild(sc); }
    addEventListener('error', (e) => {
      if (window.__booted) return;
      const t = e.target;
      if (t && t !== window && (t.src || t.href)) return bootFail('有檔案下載失敗', '網路可能不穩，重新整理再試一次。');
      if (shim && /specifier|resolve|import/i.test(e.message || '')) return;   // 補丁會自己重新載入
      bootFail('遊戲載入失敗', e.message);
    }, true);
    addEventListener('unhandledrejection', (e) => { if (!window.__booted) bootFail('遊戲載入失敗', String((e.reason && e.reason.message) || e.reason)); });
    setTimeout(() => { if (!window.__booted) bootFail('載入比較久……', '可能是網路比較慢，可以再等一下，或重新整理試試。', false); }, 25000);
  })();
</script>
