<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>上班啟示錄</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6e3c8; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; touch-action: none; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; -webkit-user-drag: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  /* 左上：小葵的職稱與經驗條 */
  #me { position: absolute; left: 10px; top: calc(8px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; background: #2c3e57d9; border-radius: 26px; padding: 4px 12px 4px 4px; color: #fff; }
  #me .face { width: 38px; height: 38px; border-radius: 50%; background: #ffcf8a url() center/cover; display: grid; place-items: center; font-weight: 900; font-size: 15px; color: #8a4b1f; border: 3px solid #ffd34d; }
  #me .t { font-weight: 900; font-size: 14px; line-height: 1.1; }
  #me .bar { width: 96px; height: 7px; border-radius: 4px; background: #ffffff33; margin-top: 4px; overflow: hidden; }
  #me .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffd34d, #ff8a3d); border-radius: 4px; transition: width .25s; }
  #money { position: absolute; right: 10px; top: calc(8px + env(safe-area-inset-top)); background: #2c3e57d9; color: #fff; font-weight: 900; font-size: 21px; padding: 5px 14px 5px 8px; border-radius: 24px; display: flex; align-items: center; gap: 7px; }
  #money i { display: inline-block; width: 28px; height: 18px; border-radius: 4px; background: linear-gradient(90deg, #36c35d 0 33%, #e3f6c8 33% 67%, #36c35d 67%); box-shadow: 0 2px 0 #1f8a3c; }
  #money.bump { animation: bump .22s; }
  @keyframes bump { 50% { transform: scale(1.14); } }
  #ver { position: absolute; right: 12px; top: calc(52px + env(safe-area-inset-top)); font-size: 10px; color: #2c3e57; opacity: .5; font-weight: 700; }
  #hint { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #fffffff0; color: #2c3e57; font-weight: 800; font-size: 15px; padding: 9px 18px; border-radius: 22px; white-space: nowrap; box-shadow: 0 4px 12px #0002; }
  #toast { position: absolute; left: 50%; top: 21%; transform: translate(-50%, -50%) scale(.8); background: #ff7a45; color: #fff; font-weight: 900; font-size: 19px; padding: 9px 20px; border-radius: 16px; opacity: 0; transition: all .25s; white-space: nowrap; box-shadow: 0 4px 0 #c4501f; }
  #toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  /* 升級／升職大橫幅 */
  #banner { --bc: #ff7a45; position: absolute; left: 50%; top: 33%; transform: translate(-50%, -50%) scale(.3); opacity: 0; text-align: center; pointer-events: none; }
  #banner.on { animation: bannerIn 2.6s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-6deg); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(2deg); } 20% { transform: translate(-50%, -50%) scale(1) rotate(0); } 85% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60%) scale(.95); } }
  #banner .b-stars { color: #ffd34d; font-size: 30px; letter-spacing: 4px; text-shadow: 0 3px 0 #b8860b, 0 0 18px #ffd34d; }
  #banner .b-title { font-size: 34px; font-weight: 900; color: #fff; background: var(--bc); padding: 8px 26px; border-radius: 20px; box-shadow: 0 6px 0 #0003, 0 0 40px var(--bc); white-space: nowrap; -webkit-text-stroke: 1px #0002; }
  #banner .b-sub { margin-top: 10px; font-size: 16px; font-weight: 900; color: var(--bc); background: #fff; display: inline-block; padding: 5px 16px; border-radius: 14px; box-shadow: 0 3px 0 #0002; }
  /* 年度業績條、事件倒數、滿意度 */
  #year { position: absolute; left: 50%; top: calc(54px + env(safe-area-inset-top)); transform: translateX(-50%); width: min(300px, 78vw); background: #2c3e57d9; border-radius: 14px; padding: 5px 10px 7px; color: #fff; font-weight: 900; font-size: 12px; display: none; }
  #year .row { display: flex; justify-content: space-between; gap: 6px; }
  #year .bar { height: 8px; border-radius: 4px; background: #ffffff33; margin-top: 4px; overflow: hidden; position: relative; }
  #year .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7dff9a, #36c35d); transition: width .3s; }
  #year .qs { display: flex; gap: 3px; margin-top: 4px; }
  #year .qs b { flex: 1; height: 4px; border-radius: 2px; background: #ffffff33; }
  #year .qs b.on { background: #ffd34d; }
  #chips { position: absolute; left: 50%; top: calc(108px + env(safe-area-inset-top)); transform: translateX(-50%); display: flex; gap: 6px; }
  #chips span { background: #fff; color: #2c3e57; font-weight: 900; font-size: 12px; padding: 4px 10px; border-radius: 12px; box-shadow: 0 2px 6px #0002; white-space: nowrap; }
  #chips .rush { background: #ff5d3a; color: #fff; animation: pulse .8s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.06); } }
  /* 採購部清單 */
  #shop { position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); width: min(360px, 94vw); max-height: 52vh; overflow: auto; background: #fffdf7; border-radius: 20px; box-shadow: 0 10px 30px #0004; padding: 10px 12px 12px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 4; touch-action: pan-y; }
  #shop.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  #shop h3 { margin: 2px 4px 8px; font-size: 17px; color: #2c3e57; display: flex; justify-content: space-between; align-items: center; }
  #shop h3 button { border: 0; background: #eee; border-radius: 12px; width: 28px; height: 28px; font-weight: 900; }
  #shop .sec { font-size: 12px; font-weight: 900; color: #8a6a4c; margin: 8px 4px 4px; }
  #shop .it { display: flex; align-items: center; gap: 8px; padding: 7px 6px; border-radius: 12px; }
  #shop .it:nth-child(even) { background: #f6efe2; }
  #shop .ic { font-size: 26px; width: 34px; text-align: center; }
  #shop .tx { flex: 1; line-height: 1.25; }
  #shop .tx b { font-size: 14px; color: #2c3e57; } #shop .tx small { display: block; font-size: 11px; color: #7a6a5a; }
  #shop .buy { border: 0; border-radius: 14px; padding: 7px 10px; font-weight: 900; font-size: 13px; background: #36c35d; color: #fff; box-shadow: 0 3px 0 #1f8a3c; min-width: 74px; }
  #shop .buy:disabled { background: #c9c2b5; box-shadow: 0 3px 0 #9c9488; }
  #shop .buy.done { background: #ffd34d; color: #7a5a00; box-shadow: none; }
  /* 尾牙結算 */
  #finale { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0006; z-index: 6; padding: 18px; }
  #finale.on { display: flex; }
  #finale .card { background: linear-gradient(#fff6e0, #ffe2b8); border-radius: 24px; padding: 20px 18px; width: min(360px, 92vw); text-align: center; box-shadow: 0 10px 40px #0005; border: 4px solid #ffd34d; }
  #finale h2 { margin: 0 0 4px; font-size: 26px; color: #d9483b; }
  #finale .mvp { font-size: 15px; font-weight: 900; color: #8a4b1f; margin-bottom: 10px; }
  #finale .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0 14px; }
  #finale .stats div { background: #fff; border-radius: 12px; padding: 6px; font-size: 12px; color: #7a6a5a; }
  #finale .stats b { display: block; font-size: 17px; color: #2c3e57; }
  #finale button { font: inherit; font-weight: 900; font-size: 16px; border: 0; border-radius: 18px; padding: 11px 16px; margin: 4px; }
  #finale .stay { background: #fff; color: #2c3e57; box-shadow: 0 4px 0 #0002; }
  #finale .move { background: #ff5d3a; color: #fff; box-shadow: 0 4px 0 #b8381c; }
  #finale small { display: block; margin-top: 8px; font-size: 11px; color: #8a6a4c; }
  #reset { margin-top: 6px; background: none !important; box-shadow: none !important; color: #8a4b1f !important; font-size: 13px !important; padding: 4px 10px !important; text-decoration: underline; display: none; }
  #stick { position: fixed; width: 120px; height: 120px; border-radius: 50%; background: #ffffff55; border: 3px solid #ffffffaa; display: none; pointer-events: none; z-index: 3; }
  #knob { position: absolute; left: 32px; top: 32px; width: 50px; height: 50px; border-radius: 50%; background: #ffffffe6; box-shadow: 0 2px 6px #0003; }
  #cover { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(circle at 50% 35%, #ffe9c9, #f2b98a 70%, #e28f63); color: #5a2e14; z-index: 5; text-align: center; padding: 24px; }
  #cover h1 { margin: 0; font-size: 46px; letter-spacing: 4px; color: #fff; text-shadow: 0 4px 0 #c4501f, 0 0 30px #ff9a5a; }
  #cover p { margin: 0; font-size: 15px; line-height: 1.7; font-weight: 700; }
  #cover button { font: inherit; font-size: 21px; font-weight: 900; padding: 13px 44px; border: 0; border-radius: 30px; background: #ff5d3a; color: #fff; box-shadow: 0 6px 0 #b8381c; cursor: pointer; }
  #cover button:disabled { background: #c9a98f; box-shadow: 0 6px 0 #9c7d66; }
  #cover small { font-size: 12px; opacity: .6; }
</style>
</head>
<body>
<div id="hud">
  <div id="me"><div class="face">葵</div><div><div class="t" id="meTitle">Lv1 實習生</div><div class="bar"><i id="meBar"></i></div></div></div>
  <div id="money"><i></i><span id="moneyTxt">0</span></div>
  <div id="ver"></div>
  <div id="hint">拖曳畫面移動</div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="year"><div class="row"><span id="yearTitle">第 1 年　Q1 業績</span><span id="yearNum">0 / 0</span></div><div class="bar"><i id="yearBar"></i></div><div class="qs"><b></b><b></b><b></b><b></b></div></div>
  <div id="chips"></div>
</div>
<div id="shop"><h3><span>🛒 採購部</span><button id="shopX">✕</button></h3><div id="shopList"></div></div>
<div id="finale"><div class="card">
  <h2>🎉 尾牙 🎉</h2><div class="mvp" id="finMvp"></div>
  <div class="stats" id="finStats"></div>
  <button class="stay" id="finStay">繼續上班</button><button class="move" id="finMove">搬到新辦公室</button>
  <small id="finNote"></small>
</div></div>
<div id="stick"><div id="knob"></div></div>
<div id="cover">
  <h1>上班啟示錄</h1>
  <p>新人小葵報到第一天，什麼雜事都要做。<br>煮咖啡、印文件、補貨、接電話，把破爛茶水間升級成產線！</p>
  <button id="start" disabled>載入中…</button>
  <button id="reset">從頭開始</button>
  <small id="coverVer"></small>
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}
</script>
<script type="module" src="js/main.js?v=0.4.0"></script>
</body>
</html>
